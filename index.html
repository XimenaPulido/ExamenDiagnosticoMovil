<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos - E-commerce</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/main.css">
    

</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
        <div class="container py-2">
            <a class="navbar-brand fw-bold fs-4" href="#">Brand</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link text-dark fw-medium" href="#">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link text-muted" href="#">Productos</a></li>
                    <li class="nav-item"><a class="nav-link text-muted" href="#">Nosotros</a></li>
                </ul>

                <div class="d-flex align-items-center">
                    <button class="btn position-relative p-0 border-0" id="cart-btn" aria-label="Carrito de compras">
                        <i class="bi bi-cart3 fs-4 text-dark"></i>
                        <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.65rem;">
                            0
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

<!-- Cambiamos a un contenedor estándar de Bootstrap para pantallas grandes -->
<main class="container my-4" style="max-width: 900px;">
    
    <h1 class="h3 fw-bold mb-4">Nuestros productos</h1>

    <!-- Barra de Búsqueda -->
    <div class="row g-2 mb-4 justify-content-center">
        <div class="col-9 col-md-8">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0 text-muted">
                    <i class="bi bi-search"></i>
                </span>
                <input type="text" id="search-input" class="form-control border-start-0 ps-0 shadow-none" placeholder="Buscar productos...">
            </div>
        </div>
        <div class="col-3 col-md-2">
            <button class="btn btn-light border w-100 fw-medium text-secondary" id="filter-btn">Filtrar</button>
        </div>
    </div>

    <!-- 
      - row-cols-1: 1 columna por defecto (móviles -> formato horizontal de la imagen).
      - row-cols-md-2: 2 columnas desde pantallas medianas en adelante (computadoras -> formato de tarjeta vertical tradicional).
    -->
    <div class="row row-cols-1 row-cols-md-2 g-4" id="products-container">
        <!-- Tarjetas inyectadas por JS -->
    </div>

    <!-- Paginación -->
    <nav class="mt-5" aria-label="Navegación">
        <ul class="pagination justify-content-center" id="pagination-container">
        </ul>
    </nav>

</main>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/product.js"></script>
</body>
</html>
